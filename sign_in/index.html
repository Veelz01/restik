<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <section class="sign_in">
        <div class="left_div">
            <div class="for_logos">
               <a href="../benzo/index.html"><img src="resource/logos/Logo Delizioso.svg" alt=""></a>
            </div>
            <div class="sign_up">
                <div class="center_sign_up">
                    <div class="title_text">
                        <h1>Sign up</h1>
                        <p>Don't have an account?<a href="../login/index.html"> Log in</a></p>
                    </div>
                    <div class="inputs_text">
                        <div>
                            <p>Full name</p>
                            <input type="text" placeholder="Robert Martine">
                        </div>
                        <div>
                            <p>Email address</p>
                            <input type="text" placeholder="Robertmartine@gmail.com">
                        </div>
                        <div>
                            <p>Password</p>
                            <input type="password" placeholder="*************">
                        </div>
                        <div class="uhti">
                            <div>
                                <input type="checkbox">
                                <p>Remember  me</p>
                            </div>
                            <a href="">Forget Password?</a>
                        </div>
                    </div>
                    <div class="buttons_sign_up">
                        <button class="orange">Sign up</button>
                        <button class="google_butt"><img src="resource/google 1.svg" alt="">Sign up with google</button>
                    </div>
                    <div class="copirait">
                        <p>Copyright © 2022 Delizioso</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="right_div">

        </div>
        <!-- <img src="resource/blini.png" alt="" class="right_div"> -->
    </section>
</body>
</html>
